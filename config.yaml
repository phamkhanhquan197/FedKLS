---

common:
  data_type : dirichlet_niid # data_type = data distribution one among ['iid','dirichlet_niid']
  # dataset : cifar100 # data_set = data set used one among ['kkim0451/UPMC-Food101', 'pranavmr/MM-IMDb','SetFit/20_newsgroups', 'legacy-datasets/banking77', 'fancyzhx/dbpedia_14', 'cifar10', 'cifar100', 'mnist', 'fashion_mnist', 'sasha/dog-food', 'zh-plus/tiny-imagenet', 'Mike0307/MNIST-M', 'flwrlabs/usps']
  dataset: SetFit/20_newsgroups
  # dataset: legacy-datasets/banking77
  # dataset: zh-plus/tiny-imagenet
  dirichlet_alpha : 0.05 #dirichlet concentration parameter (only used if data_type is dirchlet-niid)
  target_acc : 0.99
  # model : Qwen/Qwen1.5-0.5B # one among [distilbert-base-uncased, bert-base-uncased, meta-llama/Llama-2-7b-hf, Qwen/Qwen1.5-0.5B, Net, CifarNet, SimpleCNN, KerasExpCNN, MNISTCNN, SimpleDNN, FMCNNModel,FedAVGCNN,Resnet18, Resnet34,ResNet18Pretrained, ResNet34Pretrained,ResNet18Small, ResNet20Small,MobileNetV2,EfficientNetB0,LSTMModel]
  model: distilbert-base-uncased
  # model: Resnet18
  # Optional: redirect Ray session/spill files off /tmp (useful when /tmp is nearly full)
  ray_tmp_dir: /home/ai/tmp # /home/ai/tmp, /tmp
  optimizer : sgd # one among [sgd,adam]
  sgd_momentum : 0.9
  seed : 123  #123 456 789
  multi_node : False
  save_log : True
  num_train_thread: 10 #Save the most memory when setting to 1
  num_test_thread: 10

server:
  num_rounds : 1000 # default 1000
  address : 127.0.0.1
  fraction_fit : 0.3 # fraction of clients to be selected for training
  min_fit_clients : 3 # minimum number of clients to be selected for training
  num_clients : 10 # total number of clients participating in training
  fraction_evaluate : 1 # fraction of clients to be selected for evaluation
  min_evaluate_clients : 10 # minimum number of clients to be selected for evaluation
  strategy : FedPOE  #[FedAWA, FedKLSVD, FedAvg, FFALoRA, PFedMoAP, FedLaw, FedProx, FedAvgM, FedOpt, FedAdam, FedMedian, PowD, Scaffold, FedNova, FedSVD, FedPOE]

client:
  loss: FocalLoss # [CrossEntropyLoss, FocalLoss]
  epochs : 1
  batch_size : 8
  test_batch_size : 8
  lr: 0.005 #  [0.00002, 0.0001,0.001, 0.005, 0.01, 0.1, 0.2] 0.005->distilbert-base-uncased, 0.001->bert-base-uncased, 0.0001->Qwen/Qwen1.5-0.5B
  save_train_res : True
  # Too many total_cpus lets Ray schedule many actors concurrently and can OOM host RAM.
  # Keep this near your physical core count.
  total_cpus : 40
  total_gpus : 1 # no. of GPU's assigned for whole simulation
  gpu : True  # True or Faslse, Use GPU for training or not.
  # Request more resources per actor => fewer concurrent actors => less RAM/GPU contention.
  num_cpus : 4
  # With 1 GPU total, setting 1.0 forces a single GPU actor at a time.
  num_gpus : 0.1

peft:
  enabled: False #False = FFT, do not set method = fedkls when running FFT, pfedmoap do not run with peft=True
  rank: 32
  alpha: 32 #Equal to the rank
  method: lora # ['pissa', 'milora', 'middle', 'fedkls', 'lora', 'ffa_lora', 'fedsa_lora ','pfedmoap', 'flex_lora']
  bias: True #To send the bias layer(after A/B) to server for aggregation or not
  layer: attention_only #['all_linear','attention_only']

# FedSVD (fed-svd-like) config
fedsvd_config:
  mode: "ffa"       # "fedavg" (aggregate A+B) | "ffa" (aggregate B only)
  send_deltas: False   # True => clients send deltas; server applies deltas to round-start params
  agg_flora: False     # (placeholder) requires delta semantics
  agg_fedex: False     # (placeholder) requires delta semantics
  # Optional: rerun SVD on LoRA (server-side) periodically, like 3rd-party/fed-svd
  # 0 disables. 1 means rerun every round after warmup.
  recalculate_svd_period: 1
  svd_warmup_steps: 1
  dp:
    enabled: False        # True => enable DP-SGD (Opacus) during client training
    eps: 8.0              # target epsilon (used to compute noise_multiplier if noise_multiplier is null)
    delta: 1.0e-5         # target delta
    max_grad_norm: 2.0    # per-sample grad clipping norm
    noise_multiplier: null  # override if set; otherwise computed from (eps, delta, sample_rate, epochs)
    secure_rng: False     # True => use secure RNG (slower)

# FedPOE (Hedge mixture) config
# Mirrors the 3rd-party Fed-POE idea of updating per-client weights (a,b)
# via exponentiated losses.
fedpoe_config:
  eta: 0.1  # set >0 to enable a,b updates: a*=exp(-eta*loss_fed), b*=exp(-eta*loss_loc)
  period : 1 # number update model server, default if POE is 20
  M : 4   # number of local epochs per POE update

# FedPOERegressionText: regression-style POE over text embeddings using an RFF head
fedpoe_regression_text_config:
  eta: 0.1
  lam: 0.0
  num_kernels: 4
  n_components: 256
  pooling: auto

# FedSVD (fed-svd-like) config
fedsvd_config:
  mode: "ffa"       # "fedavg" (aggregate A+B) | "ffa" (aggregate B only)
  send_deltas: False   # True => clients send deltas; server applies deltas to round-start params
  agg_flora: False     # (placeholder) requires delta semantics
  agg_fedex: False     # (placeholder) requires delta semantics
  # Optional: rerun SVD on LoRA (server-side) periodically, like 3rd-party/fed-svd
  # 0 disables. 1 means rerun every round after warmup.
  recalculate_svd_period: 1
  svd_warmup_steps: 1
  dp:
    enabled: False        # True => enable DP-SGD (Opacus) during client training
    eps: 8.0              # target epsilon (used to compute noise_multiplier if noise_multiplier is null)
    delta: 1.0e-5         # target delta
    max_grad_norm: 2.0    # per-sample grad clipping norm
    noise_multiplier: null  # override if set; otherwise computed from (eps, delta, sample_rate, epochs)
    secure_rng: False     # True => use secure RNG (slower)

# FedPOE (Hedge mixture) config
# Mirrors the 3rd-party Fed-POE idea of updating per-client weights (a,b)
# via exponentiated losses.
fedpoe_config:
  eta: 0.1  # set >0 to enable a,b updates: a*=exp(-eta*loss_fed), b*=exp(-eta*loss_loc)
  period : 1 # number update model server, default if POE is 20
  M : 4   # number of local epochs per POE update

# FedPOERegressionText: regression-style POE over text embeddings using an RFF head
fedpoe_regression_text_config:
  eta: 0.1
  lam: 0.0
  num_kernels: 4
  n_components: 256
  pooling: auto

# NEW: Dynamic Data Updates Configuration
dynamic_data:
  enabled: False  # Enable/disable dynamic data updates
  mode: "incremental"  # "reset" or "incremental"
  round_step: 10  # Dataset update frequency (trigger reload every N rounds)
  start_fraction: 0.3  # For incremental: initial data fraction per client (e.g., 0.3 = 30%)

# FFA-LoRA baseline config
ffa_lora_config:
  # Options: kaiming | gaussian | orthogonal | svd
  init_method: "svd"

# FedSA-LoRA baseline config
fedsa_lora_config:
  init_method: kaiming   # kaiming | gaussian | orthogonal | svd

pfedmoap_config:
  prompt_len: 16        # number of learnable prompt tokens; the prompt is the ONLY parameter trained and exchanged each round
  non_local_k: 4        # number of non-local expert prompts (from other clients) selected by the server and sent to each client
  dgating: 128          # hidden dimension of the gating network used to mix the local prompt with expert prompts
  heads: 8              # number of attention heads for multi-head attention when combining local and expert prompts
  lambda_local: 1.0     # regularization weight for the local prompt; higher favors personalization, lower relies more on experts

flex_lora_config:
  global_rank: 200
  # Type 1: r=8 on all layers
  # Type 2: r=30 on all layers
  # Type 3: r=30 on attention layers, r=200 on FFN layers
  # Type 4: r=200 on all layers
  #Options: uniform | heavy_tail_light | heavy_tail_strong | normal
  distribution: normal 

  fedawa_config:
  server_valid_ratio: 0.2 
  server_epochs: 1       
  server_optimizer: adam   
  server_lr: 0.05
  gamma: 1.0            
  reg_distance: cos       

fedlaw_config:
  server_funct : 'exp' #['exp' or 'quad'] #currently exp only is implemented
  server_optimizer : 'adam'
  server_valid_ratio : 0.02 #percentage of data used for server side retraining
  server_epochs : 10

fedprox:
  proximal_mu : 0.01

powd_config:
  candidate_client_set: 20 # the d parameter (client fraction ≤ d ≤ total clients)
